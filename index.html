};
art = function (id) { return '<svg viewBox="0 0 200 150" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><ellipse cx="100" cy="138" rx="66" ry="6" fill="#0e1220" opacity=".1"/>' + C(100, 72, 62, "#fff", "#e2e1dc") + (DISH[id] || DISH.b1)() + '</svg>'; };
function hero() {
  return '<section class="hero"><div><p class="kicker">' + greet() + '</p><h1>Your lunch.<br><em>Your time.</em><br>Your workplace.</h1><p class="lead">The future of lunch is here.</p><p class="sub" style="text-transform:capitalize">' + tomorrow + '</p><span class="cut">Prenota entro le ' + CUTOFF + ' di oggi</span>' + searchHtml() + '<div class="kpis"><div><b>' + MENU.length + '</b><span>Piatti</span></div><div><b>' + SLOTS[0].split(" ")[0] + '</b><span>Prima consegna</span></div><div><b>In ufficio</b><span>Direttamente da te</span></div></div></div><div class="art">' + art("b1") + '</div></section>';
}
var qty = {}, step = "menu", order = null, saved = {};
try { saved = JSON.parse(localStorage.getItem("cliente") || "{}"); } catch (e) {}
var app = document.getElementById("app"), bar = document.getElementById("bar");
var eur = function (n) { return new Intl.NumberFormat("it-IT", {style:"currency", currency:"EUR"}).format(n); };
var esc = function (s) { return String(s).replace(/[&<>"']/g, function (c) { return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); };
var tomorrow = new Date(Date.now() + 864e5).toLocaleDateString("it-IT", {weekday:"long", day:"numeric", month:"long"});
var cats = MENU.map(function (m) { return m.cat; }).filter(function (c, i, a) { return a.indexOf(c) === i; });
function items() { return MENU.filter(function (m) { return qty[m.id] > 0; }); }
function count() { return items().reduce(function (s, m) { return s + qty[m.id]; }, 0); }
function total() { return items().reduce(function (s, m) { return s + qty[m.id] * m.price; }, 0); }
function head() {
  return '<header><p class="kicker">Pranzo sano in azienda</p><h1>Menu di domani</h1><p class="sub" style="text-transform:capitalize">' + tomorrow + '</p><span class="cut">Prenota entro le ' + CUTOFF + ' di oggi</span></header>';
}
function card(m) {
  var q = qty[m.id] || 0;
  var ctl = q ? '<div class="qty"><button data-act="dec" data-id="' + m.id + '" aria-label="Togli">−</button><span>' + q + '</span><button data-act="inc" data-id="' + m.id + '" aria-label="Aggiungi">+</button></div>' : '<button class="add" data-act="inc" data-id="' + m.id + '">Aggiungi</button>';
  return '<article class="card"><div class="ph">' + art(m.id) + (BEST[m.id] ? '<span class="badge">' + BEST[m.id] + '</span>' : "") + '</div><h3>' + m.name + '</h3><p>' + m.desc + '</p><div class="meta">' + (m.rating ? '<span class="tag">★ ' + m.rating + '</span>' : "") + '<span class="tag">' + m.kcal + ' kcal</span>' + m.tags.map(function (t) { return '<span class="tag">' + t + '</span>'; }).join("") + '</div><div class="row"><span class="price">' + eur(m.price) + '<small class="tier">' + tier(m.price) + '</small></span>' + ctl + '</div></article>';
}
function tier(p) { return p < 6 ? "€" : p < 8.5 ? "€€" : "€€€"; }
var CHEF = ["b2", "p1", "s1", "i2"], TREND = ["b1", "s1", "d1", "i1"];
var FILTERS = [["", "Tutti"], ["Vegano", "Vegano"], ["Vegetariano", "Vegetariano"], ["Senza glutine", "Senza glutine"], ["Pesce", "Pesce"], ["light", "Sotto 450 kcal"]];
var ICON = {
 Bowl: '<svg viewBox="0 0 24 24"><path d="M3 11h18a9 9 0 0 1-18 0zM8 7c0-2 2-2 2-4M13 7c0-2 2-2 2-4"/></svg>',
 Primi: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M8 12a4 4 0 0 1 8 0M10 15a2 2 0 0 1 4 0"/></svg>',
 Secondi: '<svg viewBox="0 0 24 24"><path d="M14 4a6 6 0 0 1 3 9l-3 2-5-5 2-3zM9 15l-4 4M7 17l-2-2"/></svg>',
 Insalate: '<svg viewBox="0 0 24 24"><path d="M5 19C5 10 10 5 19 5c0 9-5 14-14 14zM5 19l8-8"/></svg>',
 Dessert: '<svg viewBox="0 0 24 24"><path d="M5 13h14l-1.500 7h-11zM7 13a5 5 0 0 1 10 0M12 5V3"/></svg>'
};
var query = "", filt = "";
function greet() { var h = new Date().getHours(); return (h < 12 ? "Buongiorno" : h < 18 ? "Buon pomeriggio" : "Buonasera") + (saved.nome ? ", " + esc(saved.nome.split(" ")[0]) : ""); }
function searchHtml() { return '<label class="search"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.500-3.500"/></svg><input id="q" type="search" autocomplete="off" placeholder="Cerca un piatto o un ingrediente…" value="' + esc(query) + '"></label>'; }
function chipsHtml() { return '<div class="chips">' + FILTERS.map(function (f) { return '<button data-act="filt" data-id="' + f[0] + '"' + (filt === f[0] ? ' class="on"' : '') + '>' + f[1] + '</button>'; }).join("") + '</div>'; }
function match(m) {
  var q = query.toLowerCase(), ok = !q || (m.name + " " + m.desc + " " + m.cat).toLowerCase().indexOf(q) > -1;
  if (!filt) return ok;
  if (filt === "light") return ok && m.kcal < 450;
  if (filt === "Vegetariano") return ok && (m.tags.indexOf("Vegetariano") > -1 || m.tags.indexOf("Vegano") > -1);
  return ok && m.tags.indexOf(filt) > -1;
}
function byIds(a) { return a.map(function (i) { return MENU.filter(function (m) { return m.id === i; })[0]; }).filter(Boolean); }
function lastIds() { try { return JSON.parse(localStorage.getItem("ultimo") || "[]"); } catch (e) { return []; } }
function rail(t, l) { return l.length ? '<section><h2>' + t + '</h2><div class="rail">' + l.map(card).join("") + '</div></section>' : ""; }
function results() {
  if (query || filt) {
    var f = MENU.filter(match);
    return '<h2>' + f.length + (f.length === 1 ? ' risultato' : ' risultati') + '</h2>' + (f.length ? '<div class="grid">' + f.map(card).join("") + '</div>' : '<p class="sub">Nessun piatto corrisponde: prova con un altro filtro.</p>');
  }
  var li = lastIds();
  return (li.length ? rail("Ordina di nuovo", byIds(li)) : rail("Consigliati per iniziare", byIds(["b1", "b2", "s1", "i2"]))) +
    rail("La selezione dello chef", byIds(CHEF)) + rail("I più richiesti", byIds(TREND)) + rail("Leggeri, sotto 400 kcal", MENU.filter(function (m) { return m.kcal < 400; })) +
    cats.map(function (c) { return '<section id="sec-' + c + '"><h2>' + c + '</h2><div class="grid">' + MENU.filter(function (m) { return m.cat === c; }).map(card).join("") + '</div></section>'; }).join("");
}
function menuView() {
  var nav = '<nav>' + cats.map(function (c) { return '<button data-act="go" data-id="' + c + '">' + (ICON[c] || "") + c + '</button>'; }).join("") + '</nav>';
  var secs = cats.map(function (c) {
    return '<section id="sec-' + c + '"><h2>' + c + '</h2><div class="grid">' + MENU.filter(function (m) { return m.cat === c; }).map(card).join("") + '</div></section>';
  }).join("");
  return hero() + chipsHtml() + nav + '<div id="res">' + results() + '</div><section class="banner"><h2>Pranzo sano, senza uscire dall’ufficio.</h2><p>Prenota entro le ' + CUTOFF + ' e ricevi domani direttamente alla tua scrivania.</p></section>';
}
function formView() {
  var lines = items().map(function (m) { return '<div><span>' + qty[m.id] + ' × ' + m.name + '</span><span>' + eur(qty[m.id] * m.price) + '</span></div>'; }).join("");
  var opts = SLOTS.map(function (s) { return '<option' + (saved.slot === s ? " selected" : "") + '>' + s + '</option>'; }).join("");
  return head() + '<h2>Il tuo ordine</h2><div class="sum">' + lines + '<div class="tot"><span>Totale</span><span>' + eur(total()) + '</span></div></div>' +
  '<h2>Dove consegniamo</h2><form id="f"><div class="two"><div><label for="n">Nome e cognome</label><input id="n" required autocomplete="name" value="' + esc(saved.nome || "") + '"></div>' +
  '<div><label for="t">Telefono</label><input id="t" type="tel" required autocomplete="tel" value="' + esc(saved.tel || "") + '"></div>' +
  '<div><label for="a">Azienda</label><input id="a" required value="' + esc(saved.azienda || "") + '"></div>' +
  '<div><label for="r">Piano / reparto</label><input id="r" placeholder="es. 2° piano, Amministrazione" value="' + esc(saved.reparto || "") + '"></div></div>' +
  '<label for="s">Fascia di consegna</label><select id="s">' + opts + '</select>' +
  '<label for="x">Note o allergie</label><textarea id="x" rows="3" placeholder="es. senza noci, salsa a parte"></textarea>' +
  '<div class="actions"><button class="btn" type="submit">Conferma prenotazione</button><button class="btn ghost" type="button" data-act="back">Torna al menu</button></div></form>';
}
function doneView() {
  var o = order;
  var lines = o.rows.map(function (r) { return '<div><span>' + r.q + ' × ' + r.name + '</span><span>' + eur(r.q * r.price) + '</span></div>'; }).join("");
  return head() + '<h2>Prenotazione confermata</h2><p class="sub">Il tuo codice ordine</p><div class="code">' + o.code + '</div>' +
  '<div class="sum">' + lines + '<div class="tot"><span>Totale</span><span>' + eur(o.tot) + '</span></div></div>' +
  '<p>Consegna per <strong>' + esc(o.nome) + '</strong> presso <strong>' + esc(o.azienda) + '</strong>' + (o.reparto ? ' (' + esc(o.reparto) + ')' : '') + ', domani tra le <strong>' + o.slot + '</strong>.</p>' +
  '<div class="actions"><button class="btn" data-act="new">Nuovo ordine</button></div>';
}
function render() {
  app.innerHTML = '<div style="display:none"></div>' + (step === "menu" ? menuView() : step === "form" ? formView() : doneView());
  var n = count();
  bar.className = "bar" + (step === "menu" && n ? " on" : "");
  document.getElementById("barinfo").innerHTML = '<strong>' + n + (n === 1 ? " piatto" : " piatti") + '</strong> · ' + eur(total());
  var f = document.getElementById("f");
  if (f) f.onsubmit = submit;
}
function submit(e) {
  e.preventDefault();
  var v = function (id) { return document.getElementById(id).value.trim(); };
  var data = {nome:v("n"), tel:v("t"), azienda:v("a"), reparto:v("r"), slot:v("s")};
  try { localStorage.setItem("cliente", JSON.stringify(data)); } catch (er) {}
  saved = data; try { localStorage.setItem("ultimo", JSON.stringify(items().map(function (m) { return m.id; }))); } catch (er2) {}
  order = {code:"PS-" + (1000 + Math.floor(Math.random() * 9000)), nome:data.nome, azienda:data.azienda, reparto:data.reparto, slot:data.slot, note:v("x"),
    rows:items().map(function (m) { return {q:qty[m.id], name:m.name, price:m.price}; }), tot:total()};
  // Qui andrà l'invio reale dell'ordine al tuo sistema (API/backend).
  step = "done"; render(); window.scrollTo(0, 0);
}
document.addEventListener("click", function (e) {
  var b = e.target.closest("[data-act]"); if (!b) return;
  var act = b.dataset.act, id = b.dataset.id;
  if (act === "inc") qty[id] = (qty[id] || 0) + 1;
  else if (act === "dec") qty[id] = Math.max(0, (qty[id] || 0) - 1);
  else if (act === "go") { var el = document.getElementById("sec-" + id); if (el) el.scrollIntoView({behavior:"smooth"}); return; }
  else if (act === "form") { step = "form"; window.scrollTo(0, 0); }
  else if (act === "filt") filt = id;
  else if (act === "back") step = "menu";
  else if (act === "new") { qty = {}; order = null; step = "menu"; window.scrollTo(0, 0); }
  var y = window.scrollY; render(); if (act === "inc" || act === "dec" || act === "filt") window.scrollTo(0, y);
});
document.addEventListener("input", function (e) { if (e.target.id === "q") { query = e.target.value.trim(); document.getElementById("res").innerHTML = results(); } });
render();
</script>
